  <style>
  html,body{margin:0;background:#101010;color:#f4f0e5;font-family:system-ui,sans-serif}*{box-sizing:border-box}
  #login-screen{min-height:100dvh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at top,#342d1a,#101010 65%)}

  .login-logo{display:block;width:96px;height:96px;object-fit:contain;background:transparent;border-radius:0;padding:0;margin:0 auto 24px}.brand{color:#d9bd70;letter-spacing:.12em;font-size:13px}h1{font-size:28px;margin:12px 0}p{color:#bbb6a8;line-height:1.6}
  label{display:block;margin:22px 0 8px}input{width:100%;padding:14px;border:1px solid #756132;border-radius:10px;background:#101010;color:#fff;font:inherit}input:focus{outline:2px solid #d9bd70;outline-offset:2px}
